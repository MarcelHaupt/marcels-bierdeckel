[build]
  # Nur der Ordner public/ geht online. Doku, Backups und Notizen bleiben privat.
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'Site is ready'"

[build.environment]
  NODE_VERSION = "22"

# HTML immer frisch
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Redirects for SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
